spring:
  application:
    name: opencontrol-erp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opencontrol}
    username: ${SPRING_DATASOURCE_USERNAME:opencontrol}
    password: ${SPRING_DATASOURCE_PASSWORD:opencontrol}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  modulith:
    events:
      jdbc-schema-initialization:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

opencontrol:
  plugins:
    storage-directory: ${OPENCONTROL_PLUGINS_DIR:./plugins}
    auto-scan: true
  events:
    outbox:
      batch-size: 50
      poll-interval-ms: 2000
      max-retry-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
