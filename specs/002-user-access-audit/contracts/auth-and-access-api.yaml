openapi: 3.0.3
info:
  title: OpenControl ERP - Identity, Access Management & Audit API
  version: 1.0.0
  description: REST API contracts for Authentication, User Management, Profile/Permission Configuration, and Audit Trail.
paths:
  /api/v1/auth/login:
    post:
      summary: Authenticate user credentials and issue JWT
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid username or password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/iam/users:
    get:
      summary: List users with pagination and filtering
      tags:
        - Users
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, SUSPENDED]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'

    post:
      summary: Create a new user with single profile assignment
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error or profile not found
        '409':
          description: Username or email already in use

  /api/v1/iam/users/{id}:
    get:
      summary: Get user details by ID
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found

    put:
      summary: Update user details and profile assignment
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /api/v1/iam/profiles:
    get:
      summary: List all access profiles
      tags:
        - Profiles
      responses:
        '200':
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileResponse'

    post:
      summary: Create a new access profile with permissions
      tags:
        - Profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '409':
          description: Profile name already exists

  /api/v1/iam/profiles/{id}:
    put:
      summary: Update profile details and permissions
      tags:
        - Profiles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'

    delete:
      summary: Delete profile (blocked if assigned to any user)
      tags:
        - Profiles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Profile deleted
        '409':
          description: Profile has active users assigned

  /api/v1/iam/permissions:
    get:
      summary: Get full catalog of available system permissions grouped by domain
      tags:
        - Profiles
      responses:
        '200':
          description: Permission catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionCatalogItem'

  /api/v1/audit/logs:
    get:
      summary: Query immutable audit trail records
      tags:
        - Audit
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
            enum: [CREATE, UPDATE, DELETE, LOGIN]
        - name: fromDate
          in: query
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated audit records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPageResponse'

components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      required: [id, username, email, fullName, status, profile]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        fullName:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
        profile:
          $ref: '#/components/schemas/ProfileSummary'
        createdAt:
          type: string
          format: date-time

    ProfileSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CreateUserRequest:
      type: object
      required: [username, email, password, fullName, profileId]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        fullName:
          type: string
        profileId:
          type: string
          format: uuid

    UpdateUserRequest:
      type: object
      required: [email, fullName, status, profileId]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
        profileId:
          type: string
          format: uuid

    UserPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        currentPage:
          type: integer

    ProfileResponse:
      type: object
      required: [id, name, isSystem, permissions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        userCount:
          type: integer
          example: 5

    CreateProfileRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    UpdateProfileRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    PermissionCatalogItem:
      type: object
      required: [category, code, label, description]
      properties:
        category:
          type: string
          example: "User Management"
        code:
          type: string
          example: "USERS_WRITE"
        label:
          type: string
          example: "Create and Edit Users"
        description:
          type: string
          example: "Grants permission to register users and update assignments"

    AuditLogEntryResponse:
      type: object
      required: [id, actorUsername, action, entityType, entityId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        actorUsername:
          type: string
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        details:
          type: string
        stateBefore:
          type: object
        stateAfter:
          type: object
        clientIp:
          type: string
        createdAt:
          type: string
          format: date-time

    AuditLogPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntryResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer

    ProblemDetail:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
